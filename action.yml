name: "Laya Issue Triage"
description: "Label new GitHub issues by type and flag the ones missing reproduction details, using a fine-tuned Laya decision model. No API key, no per-issue cost."
author: "manyamkarthik"

branding:
  icon: "tag"
  color: "purple"

inputs:
  model:
    description: "Hugging Face model id, or a local path to a checkpoint."
    required: false
    default: "harikarthikmanyam/laya-issue-triage"
  github-token:
    description: "Token used to label and comment. The default GITHUB_TOKEN is enough; the job needs issues: write."
    required: false
    default: ${{ github.token }}
  min-confidence:
    description: "Leave the issue untouched when the model is less certain than this (0-1)."
    required: false
    default: "0.60"
  apply-labels:
    description: "Apply the predicted type as a label."
    required: false
    default: "true"
  comment-on-needs-info:
    description: "Post a comment asking for reproduction details when the model says the issue is not actionable yet. Off by default, because a wrong comment is noisier than a wrong label."
    required: false
    default: "false"
  skip-if-labeled:
    description: "Do nothing when the issue already carries labels, so the bot never overwrites a human triage."
    required: false
    default: "true"
  label-prefix:
    description: "Prefix for applied labels, e.g. 'triage/' to get 'triage/bug'."
    required: false
    default: ""
  dry-run:
    description: "Predict and log, change nothing. Use this for the first run on a real repo."
    required: false
    default: "false"

outputs:
  issue_type:
    description: "One of bug, feature, question, docs."
    value: ${{ steps.triage.outputs.issue_type }}
  confidence:
    description: "Probability assigned to the chosen type."
    value: ${{ steps.triage.outputs.confidence }}
  needs_more_info:
    description: "true when the issue looks unactionable without more detail."
    value: ${{ steps.triage.outputs.needs_more_info }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Torch and the checkpoint are together well over a gigabyte. Without these
    # caches every issue pays that download again.
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: laya-pip-${{ runner.os }}-py312-v1

    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: laya-hf-${{ runner.os }}-${{ inputs.model }}-v1

    - name: Install laya
      shell: bash
      run: pip install --quiet --upgrade "laya>=0.3.5"

    - name: Triage the issue
      id: triage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python "${{ github.action_path }}/scripts/triage_action.py" \
          --model "${{ inputs.model }}" \
          --min-confidence "${{ inputs.min-confidence }}" \
          --apply-labels "${{ inputs.apply-labels }}" \
          --comment-on-needs-info "${{ inputs.comment-on-needs-info }}" \
          --skip-if-labeled "${{ inputs.skip-if-labeled }}" \
          --label-prefix "${{ inputs.label-prefix }}" \
          --dry-run "${{ inputs.dry-run }}"
