# Raw maintainer labels -> canonical triage answer.
# Names are normalized first (see scripts/labelmap.py): lowercased and stripped
# of prefixes like "Type: ", "kind/", "C-", "33 - ", "area/". Patterns below
# match the remaining stem, so '^bug$' catches "Type: Bug", "kind/bug" and
# "C-bug" alike. An issue matching two different types is dropped as ambiguous.

types:
  bug:
    - '^bugs?$'
    - '^bug report$'
    - '^defect$'
    - '^regressions?$'
    - '^crash$'
    - '^broken$'
    - '^confirmed[- ]bug$'
  feature:
    - '^features?$'
    - '^feature[- ]requests?$'
    - '^enhancements?$'
    - '^feature[- ]enhancement$'
    - '^proposals?$'
    - '^new feature$'
    - '^rfc$'
    - '^suggestions?$'
  question:
    - '^questions?$'
    - '^usage questions?$'
    - '^support$'
    - '^support requests?$'
    - '^help$'
    - '^help wanted \(question\)$'
    # Deliberately NOT '^discussion$': in rust, numpy and react that label means
    # a design debate, which reads like a feature proposal and poisons the class.
  docs:
    - '^docs?$'
    - '^documentation$'
    - '^docs?[- ]bug$'
    - '^documentation[- ](bug|issue|request)$'
    - '^docs? improvement$'

# Presence of any of these means a maintainer had to ask for more detail.
needs_info:
  - '^info[- ]needed$'
  - 'needs?[- _]?(more[- _]?)?info(rmation)?'
  - 'needs?[- _]?repro'
  - 'reproduction[- ]needed'
  - 'more[- _]?info(rmation)?[- _]?needed'
  - 'awaiting[- ](response|answer|user|reply|author)'
  - 'insufficient[- ]info'
  - 'author[- ]feedback'
  - 'cannot[- ]reproduce'
  - 'unconfirmed'
  - 'pending[- ]author'

# Issues carrying any of these are skipped entirely (bot noise, meta issues).
exclude:
  - '^duplicate$'
  - '^spam$'
  - '^invalid$'
  - '^meta$'
  - '^tracking$'
  - '^epic$'
  - '^good first issue$'
